[package]
name = "worksnap"
version = "0.1.0"
edition = "2024"
description = "Incremental tar snapshots of the work directory"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
rustix = { version = "1", features = ["process"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
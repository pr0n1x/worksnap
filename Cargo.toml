[package]
name = "worksnap"
version = "1.2.0"
edition = "2024"
rust-version = "1.87"
description = "Incremental tar snapshots of a work directory, built on GNU tar's --listed-incremental mode"
authors = ["Maksim Makarov aka pr0n1x <maxim.pronix@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pr0n1x/worksnap"
readme = "README.md"
keywords = ["backup", "tar", "incremental", "snapshot", "archive"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
rustix = { version = "1", features = ["process"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"